<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBridge English Placement Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: #f8f9fa;
  color: #0f172a;
}

header {
  background: #0f172a;
  color: #ffffff;
  padding: 28px;
  text-align: center;
}

h1, h2, h3, .logo-font {
  font-family: 'Space Mono', monospace;
  letter-spacing: -0.5px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header div {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  opacity: 0.8;
  margin-top: 4px;
}

.wrap {
  max-width: 900px;
  margin: 28px auto;
  padding: 0 18px;
}

.card {
  background: #ffffff;
  border: 2px solid #0f172a;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 8px 25px rgba(15, 23, 42, 0.08);
}

label {
  display: block;
  font-weight: 700;
  margin: 14px 0 6px;
}

input, select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
  font-family: 'Inter', sans-serif;
}

.choice {
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  padding: 14px;
  margin: 10px 0;
  cursor: pointer;
  transition: all 0.2s ease;
}

.choice:hover {
  border-color: #0f172a;
  background-color: #f8f9fa;
}

button {
  background: #0f172a;
  color: #ffffff;
  border: 0;
  border-radius: 10px;
  padding: 12px 20px;
  font-size: 16px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 14px;
}

button:disabled {
  background: #94a3b8;
  cursor: not-allowed;
}

.hidden {
  display: none;
}

.bar {
  height: 10px;
  background: #e2e8f0;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 20px;
}

.fill {
  height: 100%;
  background: #0f172a;
  width: 0;
  transition: width 0.3s ease;
}

.score {
  text-align: center;
  font-size: 64px;
  font-weight: 900;
  font-family: 'Space Mono', monospace;
  margin: 10px 0;
}

.badge {
  text-align: center;
  padding: 14px;
  border-radius: 14px;
  font-size: 21px;
  font-weight: 800;
  margin-bottom: 20px;
}

/* Score & Badge Colors */
.score-red { color: #dc2626; }
.badge-red { background: #fee2e2; color: #991b1b; }

.score-orange { color: #ea580c; }
.badge-orange { background: #ffedd5; color: #9a3412; }

.score-yellow { color: #d97706; }
.badge-yellow { background: #fef3c7; color: #92400e; }

.score-green { color: #16a34a; }
.badge-green { background: #dcfce7; color: #166534; }

.score-blue { color: #2563eb; }
.badge-blue { background: #dbeafe; color: #1e40af; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.metric {
  background: #f8f9fa;
  border: 1px solid #e2e8f0;
  padding: 16px;
  border-radius: 12px;
}

.small {
  color: #64748b;
  font-size: 14px;
}

@media(max-width: 650px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<header>
  <h1>StudyBridge</h1>
  <div>English Placement Assessment</div>
</header>

<div class="wrap">
  <div id="start" class="card">
    <h2>Before the test</h2>
    <p>Enter your age, grade, and school district. This prototype uses an adaptive question path and estimates a StudyBridge English score from 50–1100.</p>
    
    <label>Age</label>
    <input id="age" type="number" min="5" max="25">
    
    <label>Grade</label>
    <select id="grade">
      <option value="">Select grade</option>
      <option value="K">Kindergarten</option>
      <option value="1">1st</option>
      <option value="2">2nd</option>
      <option value="3">3rd</option>
      <option value="4">4th</option>
      <option value="5">5th</option>
      <option value="6">6th</option>
      <option value="7">7th</option>
      <option value="8">8th</option>
      <option value="9">9th</option>
      <option value="10">10th</option>
      <option value="11">11th</option>
      <option value="12">12th</option>
    </select>
    
    <label>School District</label>
    <input id="district" placeholder="School district">
    
    <button onclick="startTest()">Begin Test</button>
  </div>

  <div id="test" class="card hidden">
    <div id="progress"></div>
    <div class="bar"><div id="fill" class="fill"></div></div>
    <h2 id="title"></h2>
    <p id="question"></p>
    <div id="choices"></div>
    <button id="next" onclick="answer()" disabled>Next</button>
  </div>

  <div id="result" class="card hidden"></div>
</div>

<script>
const Q=[
[100,'Reading','Maya brought her jacket to school because the morning was unusually cold. At lunchtime, the sun came out and the weather became warmer. Maya left her jacket in her classroom while she went outside.',['She no longer needed it because the weather was warmer.','She forgot where she put it.','She wanted to give it to another student.','She did not like the color of it.'],'A'],
[150,'Vocabulary','The puppy was tiny. What does tiny mean?',['Very large','Very small','Very loud','Very fast'],'B'],
[200,'Language','Which sentence is written correctly?',['The dogs runs fast.','The dog run fast.','The dog runs fast.','The dogs running fast.'],'C'],
[250,'Reading','Tommy saw dark clouds. A few minutes later, drops of water began falling from the sky. Tommy quickly ran inside. Why did Tommy go inside?',['It started raining.','He wanted lunch.','He was looking for his shoes.','The sun was too bright.'],'A'],
[300,'Vocabulary','Lena carried the glass carefully because it was fragile. What does fragile mean?',['Easily broken','Very heavy','Very expensive','Completely empty'],'A'],
[350,'Language','Which sentence uses the apostrophe correctly?',["The girls backpack is red.","The girl's backpack is red.","The girls's backpack is red.","The girl's backpack are red."],'B'],
[400,'Reading','The town library extended its hours from 5 p.m. to 8 p.m. Officials said the change would make it easier for students and working adults to use the library. What is the primary purpose?',['To criticize the library','To explain a change in library hours','To describe how libraries are built','To encourage people to become librarians'],'B'],
[450,'Writing','Which would be the best topic sentence for a paragraph about exercise?',['Exercise can benefit both physical and mental health.','I have shoes.','Running is something people do.','My friend exercises every Saturday.'],'A'],
[500,'Reading','Many people assume deserts are completely lifeless. However, many plants and animals have adaptations that let them survive with little water. What is best supported?',['Deserts contain no living organisms.','Most desert animals are active during the day.','Desert organisms have ways to survive limited water.','Desert plants cannot store water.'],'C'],
[550,'Listening/Speech','A speaker explains how recycling reduces landfill waste and lets materials be reused. What is the speaker’s main purpose?',['To entertain listeners','To explain a benefit of recycling','To criticize recyclers','To describe how landfills are constructed'],'B'],
[600,'Writing','The team practiced every afternoon. ________, its performance improved significantly.',['However','Therefore','Meanwhile','Nevertheless'],'B'],
[650,'Reading','A bicycle-sharing program was expected to help commuters. Instead, usage increased most on weekends, when residents used bicycles to visit parks and neighborhoods. What does this reveal?',['The program failed.','Only commuters used it.','It was used in an unexpected way.','Residents stopped visiting parks.'],'C'],
[700,'Language','Which sentence correctly uses parallel structure?',['Maria enjoys reading, writing, and to paint.','Maria enjoys reading, writing, and painting.','Maria enjoys to read, writing, and painting.','Maria enjoys reading, to write, and painting.'],'B'],
[750,'Writing','Which is the strongest thesis statement?',['School uniforms exist in many schools.','I don’t like uniforms.','Schools should adopt uniforms because they can reduce distractions and simplify clothing choices.','Uniforms are usually shirts and pants.'],'C'],
[800,'Reading','A novel initially presents its protagonist as confident, but later reveals repeated hesitation and self-doubt. What is the best interpretation?',['The protagonist is always confident.','The protagonist may use confidence to conceal insecurity.','The narrator misunderstands the protagonist.','The protagonist has no significant traits.'],'B'],
[850,'Listening/Speech','A speaker says some people think social media weakens face-to-face communication, while others say it helps distant relationships survive. What is the speaker doing?',['Presenting two competing perspectives','Proving social media is harmful','Explaining how social media was invented','Arguing distance is unimportant'],'A'],
[900,'Reading','A historian argues that a revolution cannot be attributed solely to economic hardship because political exclusion, inequality, and distrust of government also contributed. What is central to the argument?',['Economic hardship was irrelevant.','Revolutions have one cause.','Multiple factors can interact to produce major changes.','Political exclusion always causes revolutions.'],'C'],
[950,'Language','Which sentence correctly avoids a dangling modifier?',['After reviewing the evidence, the conclusion seemed obvious to the detective.','After reviewing the evidence, the detective found the conclusion obvious.','After reviewing the evidence, the conclusion was obvious.','Reviewing the evidence, the conclusion became obvious.'],'B'],
[1000,'Vocabulary','The author’s argument is predicated upon the assumption that economic incentives influence behavior. What does predicated upon mean?',['Opposed to','Based upon','Independent of','Disproven by'],'B'],
[1050,'Reading','Critics of technological determinism argue that technology does not independently dictate social outcomes. Societies shape technologies through economic incentives, institutions, cultural expectations, and choices. What claim is supported?',['Technology has no effect on society.','Society’s response to technology can influence its effects.','All societies use technology identically.','Technology develops independently of people.'],'B'],
[1100,'Reading','A policy analyst notes that a program’s measured success depends not only on outcomes but also on which outcomes were selected, how they were measured, and which populations were excluded. What concern is the analyst raising?',['Measurement and selection can shape conclusions.','Outcomes are never useful.','Programs cannot be evaluated.','Excluded populations never matter.'],'A']
];

let age, grade, district, target=550, current, answers=[], used=new Set();
const gradeAvg={K:80,1:100,2:182,3:264,4:345,5:427,6:509,7:591,8:673,9:755,10:836,11:918,12:1000};

function startTest(){
  age=+document.getElementById('age').value;
  grade=document.getElementById('grade').value;
  district=document.getElementById('district').value.trim();
  if(!age||!grade||!district){alert('Complete all fields.');return}
  document.getElementById('start').classList.add('hidden');
  document.getElementById('test').classList.remove('hidden');
  nextQ();
}

function nextQ(){
  if(answers.length>=20||used.size>=Q.length){finish();return}
  let pool=Q.filter((x,i)=>!used.has(i));
  pool.sort((a,b)=>Math.abs(a[0]-target)-Math.abs(b[0]-target));
  let choices=pool.slice(0,Math.min(4,pool.length));
  let idx=Math.floor(Math.random()*choices.length);
  current=choices[idx];
  used.add(Q.indexOf(current));
  document.getElementById('progress').textContent='Question '+(answers.length+1)+' of 20';
  document.getElementById('fill').style.width=(answers.length/20*100)+'%';
  document.getElementById('title').textContent=current[1]+' • Difficulty '+current[0];
  document.getElementById('question').textContent=current[2];
  let box=document.getElementById('choices');
  box.innerHTML='';
  current[3].forEach((c,i)=>{
    let l=document.createElement('label');
    l.className='choice';
    l.innerHTML='<input type="radio" name="a" value="'+String.fromCharCode(65+i)+'"> '+c;
    l.onclick=()=>document.getElementById('next').disabled=false;
    box.appendChild(l);
  });
  document.getElementById('next').disabled=true;
}

function answer(){
  let a=document.querySelector('input[name=a]:checked');
  if(!a)return;
  let ok=a.value===current[4];
  answers.push({q:current,ok});
  let step=Math.max(30,Math.round(45+Math.abs(550-target)*.08));
  target=ok?Math.min(1100,target+step):Math.max(50,target-step);
  nextQ();
}

function band(s,a){
  let d=s-a;
  if(d<-220)return['red','Needs significant support (Terrible score)'];
  if(d<-80)return['orange','Below the expected range (Bad score)'];
  if(d<100)return['yellow','Around the expected range (Below average)'];
  if(d<220)return['green','Around average / above average (Average)'];
  return['blue','Advanced'];
}

function finish(){
  document.getElementById('test').classList.add('hidden');
  let score=Math.max(50,Math.min(1100,Math.round(target)));
  let ga=gradeAvg[grade],ageGrade=Math.max(1,Math.min(12,Math.round(age-5))),aa=gradeAvg[ageGrade]||100;
  let [colorKey,label]=band(score,ga);
  
  let pct=Math.max(1,Math.min(99,Math.round(50+40*Math.tanh((score-aa)/180))));
  let counts={};
  answers.forEach(x=>{if(!x.ok)counts[x.q[1]]=(counts[x.q[1]]||0)+1});
  let weak=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,3);
  let books=['Wonder — R. J. Palacio','The One and Only Ivan — Katherine Applegate','The Giver — Lois Lowry','The Outsiders — S. E. Hinton','A Wrinkle in Time — Madeleine L’Engle'];
  
  document.getElementById('result').innerHTML=
    '<h2>Your StudyBridge English Placement Result</h2>'+
    '<div class="score score-'+colorKey+'">'+score+'</div>'+
    '<div class="badge badge-'+colorKey+'">'+label+'</div>'+
    '<div class="grid">'+
      '<div class="metric"><b>Average score for '+(grade==='K'?'Kindergarten':grade+'th grade')+'</b><br>'+ga+'</div>'+
      '<div class="metric"><b>Estimated average for age '+age+'</b><br>'+aa+'</div>'+
      '<div class="metric"><b>Estimated percentile</b><br>'+pct+'th percentile</div>'+
      '<div class="metric"><b>Questions completed</b><br>'+answers.length+'</div>'+
    '</div>'+
    '<h3>What to work on</h3>'+
    '<p>'+(weak.length?weak.map(x=>'• '+x).join('<br>'):'Keep practicing across all areas.')+'</p>'+
    '<h3>Recommended books</h3>'+
    '<ol>'+books.map(x=>'<li>'+x+'</li>').join('')+'</ol>'+
    '<p class="small"><b>Prototype note:</b> The age/grade averages and percentile are sample StudyBridge reference values, not nationally normed scores. Before using this for real placement, StudyBridge should pilot the test with a representative student sample and statistically norm the scale.</p>';
  
  document.getElementById('result').classList.remove('hidden');
}
</script>
</body>
</html>

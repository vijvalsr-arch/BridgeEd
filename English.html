<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBridge Grade-Adaptive English Assessment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: #f8f9fa;
  color: #0f172a;
}

header {
  background: #0f172a;
  color: #ffffff;
  padding: 24px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h1, h2, h3, h4 {
  font-family: 'Space Mono', monospace;
  letter-spacing: -0.5px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header div {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  opacity: 0.8;
  margin-top: 4px;
}

.wrap {
  max-width: 900px;
  margin: 28px auto;
  padding: 0 18px;
}

.card {
  background: #ffffff;
  border: 2px solid #0f172a;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 8px 25px rgba(15, 23, 42, 0.08);
}

label.field-label {
  display: block;
  font-weight: 700;
  margin: 14px 0 6px;
}

input[type="number"], input[type="text"], select, textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
  font-family: 'Inter', sans-serif;
}

textarea {
  min-height: 180px;
  resize: vertical;
}

.passage-box {
  background: #f1f5f9;
  border-left: 4px solid #0f172a;
  padding: 18px;
  border-radius: 8px;
  margin-bottom: 20px;
  line-height: 1.6;
  font-size: 15px;
  max-height: 350px;
  overflow-y: auto;
}

.choice {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  padding: 14px;
  margin: 10px 0;
  cursor: pointer;
  transition: all 0.2s ease;
  font-weight: 500;
}

.choice:hover {
  border-color: #0f172a;
  background-color: #f8f9fa;
}

.choice input[type="radio"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
}

button {
  background: #0f172a;
  color: #ffffff;
  border: 0;
  border-radius: 10px;
  padding: 12px 20px;
  font-size: 16px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 14px;
}

button:disabled {
  background: #94a3b8;
  cursor: not-allowed;
}

.hidden {
  display: none;
}

.bar {
  height: 10px;
  background: #e2e8f0;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 20px;
}

.fill {
  height: 100%;
  background: #0f172a;
  width: 0;
  transition: width 0.3s ease;
}

.section-tag {
  display: inline-block;
  background: #e2e8f0;
  color: #0f172a;
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 12px;
}

.score {
  text-align: center;
  font-size: 72px;
  font-weight: 900;
  font-family: 'Space Mono', monospace;
  margin: 5px 0;
}

.badge {
  text-align: center;
  padding: 14px;
  border-radius: 14px;
  font-size: 21px;
  font-weight: 800;
  margin-bottom: 20px;
}

.score-red { color: #dc2626; }
.badge-red { background: #fee2e2; color: #991b1b; }
.score-orange { color: #ea580c; }
.badge-orange { background: #ffedd5; color: #9a3412; }
.score-yellow { color: #d97706; }
.badge-yellow { background: #fef3c7; color: #92400e; }
.score-green { color: #16a34a; }
.badge-green { background: #dcfce7; color: #166534; }
.score-blue { color: #2563eb; }
.badge-blue { background: #dbeafe; color: #1e40af; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.metric {
  background: #f8f9fa;
  border: 1px solid #e2e8f0;
  padding: 16px;
  border-radius: 12px;
}

.celebration {
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  color: #0f172a;
  margin-bottom: 10px;
}

.takeaway-box {
  background: #f1f5f9;
  border-radius: 12px;
  padding: 20px;
  margin: 20px 0;
}

.takeaway-box h4 {
  margin-top: 0;
  color: #0f172a;
}

.takeaway-box ul {
  padding-left: 20px;
  margin-bottom: 10px;
}

.takeaway-box li {
  margin-bottom: 8px;
  line-height: 1.5;
}

.book-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 10px;
}

.book-card {
  background: #ffffff;
  border: 1px solid #cbd5e1;
  padding: 12px 16px;
  border-radius: 10px;
}

.book-title {
  font-weight: 700;
  color: #0f172a;
}

.book-author {
  font-size: 13px;
  color: #64748b;
}

.avg-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 14px;
}

.avg-table th, .avg-table td {
  padding: 8px 12px;
  border: 1px solid #e2e8f0;
  text-align: left;
}

.avg-table th {
  background: #f1f5f9;
}

.avg-table tr.highlight {
  background: #e2e8f0;
  font-weight: 700;
}

@media(max-width: 650px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<header>
  <h1>StudyBridge</h1>
  <div>Grade-Adaptive English Assessment Engine</div>
</header>

<div class="wrap">
  <div id="start" class="card">
    <h2>Student Registration</h2>
    <p>Please enter your information to start your personalized test.</p>
    
    <label class="field-label">Age</label>
    <input id="age" type="number" min="5" max="25">
    
    <label class="field-label">Grade</label>
    <select id="grade">
      <option value="">Select grade</option>
      <option value="K">Kindergarten (20 Questions)</option>
      <option value="1">1st Grade (20 Questions)</option>
      <option value="2">2nd Grade (25 Questions)</option>
      <option value="3">3rd Grade (30 Questions)</option>
      <option value="4">4th Grade (40 Questions)</option>
      <option value="5">5th Grade (42 Questions)</option>
      <option value="6">6th Grade (45 Questions)</option>
      <option value="7">7th Grade (50 Questions)</option>
      <option value="8">8th Grade (50 Questions)</option>
      <option value="9">9th Grade (55 Questions)</option>
      <option value="10">10th Grade (60 Questions)</option>
      <option value="11">11th Grade (60 Questions)</option>
      <option value="12">12th Grade (60 Questions)</option>
    </select>
    
    <label class="field-label">School District</label>
    <input id="district" type="text" placeholder="School district">
    
    <button onclick="startTest()">Begin Assessment</button>
  </div>

  <div id="test" class="card hidden">
    <div id="progress"></div>
    <div class="bar"><div id="fill" class="fill"></div></div>
    
    <div id="sectionTag" class="section-tag"></div>
    
    <div id="passageContainer" class="passage-box hidden"></div>
    
    <h3 id="questionText"></h3>
    <div id="choices"></div>
    
    <div id="writingArea" class="hidden">
      <p id="writingPrompt" style="font-weight: 600; font-size: 17px;"></p>
      <textarea id="writingInput" placeholder="Type your response here..."></textarea>
    </div>
    
    <button id="next" onclick="nextQuestion()" disabled>Next</button>
  </div>

  <div id="result" class="card hidden"></div>
</div>

<script>
const gradeAvg = {K:80, 1:100, 2:182, 3:264, 4:345, 5:427, 6:509, 7:591, 8:673, 9:755, 10:836, 11:918, 12:1000};

const gradeQuestionCounts = {
  "K": 20, "1": 20, "2": 25, "3": 30, "4": 40, "5": 42,
  "6": 45, "7": 50, "8": 50, "9": 55, "10": 60, "11": 60, "12": 60
};

const writingPrompts = {
  "K": "Write 2 simple sentences about your favorite animal or pet.",
  "1": "Write 2 or 3 sentences about something fun you did on a sunny day.",
  "2": "Write 1 short paragraph (4 sentences) describing an adventure with a friend.",
  "3": "Write 1 or 2 paragraphs explaining your favorite subject in school.",
  "4": "Write a 2-paragraph story about finding a mysterious key in your yard.",
  "5": "Write a 3-paragraph essay about whether students should get extra recess.",
  "6": "Write a 3-paragraph essay discussing how technology helps or hurts students.",
  "7": "Write a 3-paragraph persuasive essay on school uniforms.",
  "8": "Write a 4-paragraph essay examining an important historical event.",
  "9": "Write a 4-paragraph analytical essay discussing the theme of a book.",
  "10": "Write a 4-paragraph essay exploring how social media influences teens.",
  "11": "Write a 5-paragraph argumentative essay on higher education accessibility.",
  "12": "Write a comprehensive essay analyzing a pressing global challenge and solutions."
};

const bookRecommendations = {
  "K-2": [
    { title: "Where the Wild Things Are", author: "Maurice Sendak", desc: "Builds imagination, sentence structure, and core vocabulary." },
    { title: "The Very Hungry Caterpillar", author: "Eric Carle", desc: "Excellent for early reading comprehension and sequencing." },
    { title: "Frog and Toad Are Friends", author: "Arnold Lobel", desc: "Great for beginner readers moving into early chapter books." },
    { title: "Green Eggs and Ham", author: "Dr. Seuss", desc: "Masterful for phonics, rhyme, and high-frequency sight words." },
    { title: "Don't Let the Pigeon Drive the Bus!", author: "Mo Willems", desc: "Fun, interactive story that introduces tone and expression." }
  ],
  "3-5": [
    { title: "Charlotte's Web", author: "E.B. White", desc: "Develops rich vocabulary and character trait analysis." },
    { title: "The One and Only Ivan", author: "Katherine Applegate", desc: "Enhances understanding of perspective, empathy, and theme." },
    { title: "Wonder", author: "R.J. Palacio", desc: "Teaches point of view and multi-perspective narrative structure." },
    { title: "Holes", author: "Louis Sachar", desc: "Excellent for practicing plot connections and figurative language." },
    { title: "Because of Winn-Dixie", author: "Kate DiCamillo", desc: "Strengthens context clue skills and emotional narrative depth." }
  ],
  "6-8": [
    { title: "The Giver", author: "Lois Lowry", desc: "Introduces central themes, symbolism, and dystopian motifs." },
    { title: "Percy Jackson & the Olympians: The Lightning Thief", author: "Rick Riordan", desc: "Engaging fiction that introduces mythical allusion and fast pacing." },
    { title: "A Wrinkle in Time", author: "Madeleine L'Engle", desc: "Pushes literary vocabulary and complex context analysis." },
    { title: "Refugee", author: "Alan Gratz", desc: "Builds historical context, comparative narrative, and critical analysis." },
    { title: "Hatchet", author: "Gary Paulsen", desc: "Great for conflict analysis and descriptive sensory details." }
  ],
  "9-12": [
    { title: "To Kill a Mockingbird", author: "Harper Lee", desc: "Essential for analyzing rhetoric, motif, and complex characterization." },
    { title: "Fahrenheit 451", author: "Ray Bradbury", desc: "Masterclass in figurative language, theme analysis, and social commentary." },
    { title: "The Great Gatsby", author: "F. Scott Fitzgerald", desc: "Rich in symbolism, precise diction, and complex sentence structures." },
    { title: "Lord of the Flies", author: "William Golding", desc: "Ideal for practicing allegorical analysis and argument synthesis." },
    { title: "Night", author: "Elie Wiesel", desc: "Deeply poignant text for historical analytical writing and tone identification." }
  ]
};

let activeTestPool = [];
let usedQuestionIds = new Set();
let currentQuestionIndex = 0;
let targetQuestionCount = 20;
let userAnswers = [];
let age = 0;
let grade = "";
let district = "";
let currentTargetScore = 500;
let currentQuestion = null;

function build50xQuestionPool(testLength) {
  const totalPoolSize = testLength * 50; 
  activeTestPool = [];
  
  const categories = ["Grammar & Mechanics", "Vocabulary Mastery", "Reading Comprehension", "Writing & Rhetoric"];
  
  const vocabWords = [
    { diff: 100, word: "big", syn: "large", ant: "small" },
    { diff: 200, word: "swift", syn: "fast", ant: "slow" },
    { diff: 350, word: "immense", syn: "huge", ant: "tiny" },
    { diff: 500, word: "meticulous", syn: "precise", ant: "careless" },
    { diff: 650, word: "benevolent", syn: "kind", ant: "cruel" },
    { diff: 800, word: "ephemeral", syn: "transient", ant: "permanent" },
    { diff: 950, word: "perspicacious", syn: "insightful", ant: "ignorant" }
  ];

  const grammarItems = [
    { diff: 120, q: "Which punctuation mark ends a question?", c: ["Question mark (?)", "Period (.)", "Comma (,)", "Exclamation mark (!)"], a: "A" },
    { diff: 250, q: "Identify the plural noun in the sentence: 'The dogs barked loudly.'", c: ["barked", "loudly", "dogs", "The"], a: "C" },
    { diff: 450, q: "Choose the sentence with correct subject-verb agreement:", c: ["The boys runs fast.", "The boys run fast.", "The boy run fast.", "The boys is running."], a: "B" },
    { diff: 600, q: "Which sentence is written in passive voice?", c: ["The dog chased the ball.", "The ball was chased by the dog.", "The dog is chasing the ball.", "The dog will chase the ball."], a: "B" },
    { diff: 850, q: "Identify the sentence that correctly uses a semicolon:", c: ["I love reading; however, I don't have much free time.", "I love reading; and writing.", "Because I love reading; I buy books.", "I love reading; books."], a: "A" }
  ];

  for (let i = 0; i < totalPoolSize; i++) {
    let targetDiff = Math.floor(50 + (i / totalPoolSize) * 1000);
    let cat = categories[i % categories.length];
    
    if (cat === "Vocabulary Mastery") {
      let v = vocabWords[i % vocabWords.length];
      let isSyn = i % 2 === 0;
      activeTestPool.push({
        id: `gen_${i}`,
        diff: targetDiff,
        category: cat,
        sec: cat,
        q: isSyn ? `What is a synonym for '${v.word}'?` : `What is the OPPOSITE (antonym) of '${v.word}'?`,
        c: isSyn 
          ? [v.syn, v.ant, "unrelated word", "incorrect choice"] 
          : [v.ant, v.syn, "unrelated word", "incorrect choice"],
        a: "A"
      });
    } else if (cat === "Grammar & Mechanics") {
      let g = grammarItems[i % grammarItems.length];
      activeTestPool.push({
        id: `gen_${i}`,
        diff: targetDiff,
        category: cat,
        sec: cat,
        q: g.q,
        c: g.c,
        a: g.a
      });
    } else if (cat === "Reading Comprehension") {
      activeTestPool.push({
        id: `gen_${i}`,
        diff: targetDiff,
        category: cat,
        sec: cat,
        q: "In a reading passage, what is the main purpose of a topic sentence?",
        c: ["To introduce the main idea of a paragraph", "To state a random fact", "To conclude the entire essay", "To list character names"],
        a: "A"
      });
    } else {
      activeTestPool.push({
        id: `gen_${i}`,
        diff: targetDiff,
        category: cat,
        sec: cat,
        q: "Which transition word best demonstrates a cause-and-effect relationship?",
        c: ["Consequently", "However", "In contrast", "Similarly"],
        a: "A"
      });
    }
  }
}

function startTest() {
  age = +document.getElementById('age').value;
  grade = document.getElementById('grade').value;
  district = document.getElementById('district').value.trim();
  
  if(!age || !grade || !district) {
    alert('Please fill out age, grade, and school district to start.');
    return;
  }
  
  currentTargetScore = gradeAvg[grade] || 500;
  targetQuestionCount = gradeQuestionCounts[grade] || 30;
  
  usedQuestionIds.clear();
  build50xQuestionPool(targetQuestionCount);
  
  document.getElementById('start').classList.add('hidden');
  document.getElementById('test').classList.remove('hidden');
  
  loadNextAdaptiveQuestion();
}

function loadNextAdaptiveQuestion() {
  const totalTotal = targetQuestionCount + 1;
  
  document.getElementById('fill').style.width = ((currentQuestionIndex / totalTotal) * 100) + '%';
  document.getElementById('progress').textContent = `Question ${currentQuestionIndex + 1} of ${totalTotal}`;
  
  document.getElementById('passageContainer').classList.add('hidden');
  document.getElementById('choices').classList.add('hidden');
  document.getElementById('writingArea').classList.add('hidden');
  document.getElementById('next').disabled = true;

  if (currentQuestionIndex < targetQuestionCount) {
    let available = activeTestPool.filter(q => !usedQuestionIds.has(q.id));
    available.sort((a, b) => Math.abs(a.diff - currentTargetScore) - Math.abs(b.diff - currentTargetScore));
    
    currentQuestion = available[0];
    usedQuestionIds.add(currentQuestion.id);
    
    document.getElementById('sectionTag').textContent = `Section: ${currentQuestion.sec}`;
    document.getElementById('questionText').textContent = currentQuestion.q;
    
    const box = document.getElementById('choices');
    box.innerHTML = '';
    box.classList.remove('hidden');
    
    currentQuestion.c.forEach((choiceText, idx) => {
      const letter = String.fromCharCode(65 + idx);
      const l = document.createElement('label');
      l.className = 'choice';
      l.innerHTML = `<input type="radio" name="option" value="${letter}"> <span><strong>${letter}.</strong> ${choiceText}</span>`;
      
      l.addEventListener('click', function() {
        const radio = l.querySelector('input[type="radio"]');
        radio.checked = true;
        document.getElementById('next').disabled = false;
      });
      
      box.appendChild(l);
    });
  } else {
    document.getElementById('sectionTag').textContent = "Final Section: Writing Activity";
    document.getElementById('questionText').textContent = "Written Composition";
    
    const promptText = writingPrompts[grade] || writingPrompts["12"];
    document.getElementById('writingPrompt').textContent = promptText;
    
    const writingArea = document.getElementById('writingArea');
    writingArea.classList.remove('hidden');
    
    const writingInput = document.getElementById('writingInput');
    writingInput.value = "";
    writingInput.addEventListener('input', function() {
      document.getElementById('next').disabled = writingInput.value.trim().length < 8;
    });
  }
}

function nextQuestion() {
  if (currentQuestionIndex < targetQuestionCount) {
    const selected = document.querySelector('input[name="option"]:checked');
    if (!selected) return;
    
    const isCorrect = selected.value === currentQuestion.a;
    
    let step = 35;
    if (isCorrect) {
      currentTargetScore = Math.min(1050, currentTargetScore + step);
    } else {
      currentTargetScore = Math.max(50, currentTargetScore - step);
    }
    
    userAnswers.push({
      category: currentQuestion.category,
      isCorrect: isCorrect,
      diff: currentQuestion.diff
    });
  } else {
    const writingText = document.getElementById('writingInput').value.trim();
    userAnswers.push({
      category: "Writing Composition",
      isCorrect: writingText.length >= 25,
      length: writingText.length
    });
  }
  
  currentQuestionIndex++;
  
  if (currentQuestionIndex < targetQuestionCount + 1) {
    loadNextAdaptiveQuestion();
  } else {
    finishTest();
  }
}

function band(score, avg) {
  let diff = score - avg;
  if(diff < -150) return ['red', 'Needs Support'];
  if(diff < -40)  return ['orange', 'Approaching Grade Level'];
  if(diff < 60)   return ['green', 'On Grade Level'];
  return ['blue', 'Advanced'];
}

function triggerConfetti() {
  if (typeof confetti === 'function') {
    confetti({
      particleCount: 100,
      spread: 70,
      origin: { y: 0.6 }
    });
  }
}

function getGradeBookBand(g) {
  if (["K", "1", "2"].includes(g)) return "K-2";
  if (["3", "4", "5"].includes(g)) return "3-5";
  if (["6", "7", "8"].includes(g)) return "6-8";
  return "9-12";
}

function finishTest() {
  document.getElementById('test').classList.add('hidden');
  
  let correctCount = userAnswers.filter(x => x.isCorrect).length;
  let totalCount = userAnswers.length;
  
  let calculatedScore = Math.round(currentTargetScore);
  let targetGradeAvg = gradeAvg[grade] || 500;
  
  let [colorKey, label] = band(calculatedScore, targetGradeAvg);
  
  triggerConfetti();

  let categoryStats = {};
  userAnswers.forEach(ans => {
    if(!categoryStats[ans.category]) {
      categoryStats[ans.category] = { total: 0, correct: 0 };
    }
    categoryStats[ans.category].total++;
    if(ans.isCorrect) categoryStats[ans.category].correct++;
  });

  let strengths = [];
  let growthAreas = [];

  Object.keys(categoryStats).forEach(cat => {
    if (cat === "Writing Composition") return;
    let pct = (categoryStats[cat].correct / categoryStats[cat].total) * 100;
    if (pct >= 70) {
      strengths.push(`<b>${cat}</b> (${Math.round(pct)}% mastery)`);
    } else {
      growthAreas.push(`<b>${cat}</b> (${Math.round(pct)}% accuracy - review foundational concepts)`);
    }
  });

  let writingObj = userAnswers.find(x => x.category === "Writing Composition");
  let writingFeedback = writingObj && writingObj.isCorrect 
    ? "Your written response met the baseline length and structural expectation for your grade level."
    : "Your writing sample was a bit brief. Focus on expanding your ideas with descriptive details and clear supporting evidence.";

  let advice = "";
  if (colorKey === 'blue') {
    advice = "You demonstrate strong advanced literacy skills above your current grade level! Focus on reading complex non-fiction and writing higher-level analytical essays.";
  } else if (colorKey === 'green') {
    advice = "You are right on track with your grade level goals! Continue practicing targeted vocabulary expansion and structural essay writing.";
  } else {
    advice = "You are building foundational skills! Dedicate 15–20 minutes daily to reading structured books and reviewing core grammar rules.";
  }

  let bookBand = getGradeBookBand(grade);
  let books = bookRecommendations[bookBand];
  let bookHtml = books.map(b => `
    <div class="book-card">
      <div class="book-title">${b.title}</div>
      <div class="book-author">by ${b.author}</div>
      <div style="font-size: 13px; margin-top: 4px; color: #334155;">${b.desc}</div>
    </div>
  `).join('');

  let tableRows = Object.keys(gradeAvg).map(g => {
    let name = g === 'K' ? 'Kindergarten' : 'Grade ' + g;
    let isUserGrade = g === grade ? 'class="highlight"' : '';
    return `<tr ${isUserGrade}><td>${name}</td><td>${gradeAvg[g]}</td></tr>`;
  }).join('');

  document.getElementById('result').innerHTML = `
    <div class="celebration">🎉 Assessment Complete! 🎉</div>
    <h2 style="text-align:center;">Your English Placement Result</h2>
    <div class="score score-${colorKey}">${calculatedScore}</div>
    <div class="badge badge-${colorKey}">${label}</div>
    
    <div class="grid">
      <div class="metric"><b>Target Expected (${grade === 'K' ? 'Kindergarten' : grade + 'th Grade'})</b><br>${targetGradeAvg}</div>
      <div class="metric"><b>Questions Correct</b><br>${correctCount} of ${totalCount}</div>
      <div class="metric"><b>District</b><br>${district}</div>
      <div class="metric"><b>Age</b><br>${age} years old</div>
    </div>
    
    <div class="takeaway-box">
      <h4>📌 Detailed Diagnostic Key Takeaways</h4>
      <ul>
        <li><b>Demonstrated Strengths:</b> ${strengths.length ? strengths.join(', ') : 'Building baseline across all evaluated areas.'}</li>
        <li><b>Priority Growth Areas:</b> ${growthAreas.length ? growthAreas.join(', ') : 'No major academic deficits detected!'}</li>
        <li><b>Written Performance Analysis:</b> ${writingFeedback}</li>
        <li><b>Strategic Next Steps:</b> ${advice}</li>
      </ul>
    </div>

    <h3>📚 Recommended Reading List (Grade ${grade})</h3>
    <p class="small">Hand-selected books to match your cognitive level and boost your literacy skills:</p>
    <div class="book-list">
      ${bookHtml}
    </div>

    <br>
    <h3>Average Score Reference Table (All Grades)</h3>
    <table class="avg-table">
      <thead><tr><th>Grade</th><th>Average Score Target</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  `;
  
  document.getElementById('result').classList.remove('hidden');
}
</script>
</body>
</html>
